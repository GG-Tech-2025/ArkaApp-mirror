name: Supabase migrations check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply all migrations to a fresh database
        run: supabase db reset

      - name: Run database tests (cross-tenant isolation)
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
