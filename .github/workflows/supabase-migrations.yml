name: Supabase migrations check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply all migrations to a fresh database
        run: supabase db reset

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
